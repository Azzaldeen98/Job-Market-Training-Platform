{% extends 'core/base.html' %}
  {% block content %}
    <div class="w-full">
        <div class="lg:hidden bg-surface border-b border-stroke-soft px-4 py-3 flex items-center justify-between sticky top-0 z-50">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 bg-brand rounded-lg flex items-center justify-center">
                    <i data-lucide="zap" class="w-5 h-5 btn-text"></i>
                </div>
                <span class="font-bold text-lg text-content">SkillMatch</span>
            </div>
            <button id="mobile-menu-btn" class="p-2 hover:bg-field-base rounded-lg transition-colors">
                <i data-lucide="menu" class="w-6 h-6 text-content-muted"></i>
            </button>
        </div>

        <div class="flex min-h-screen bg-base">
            <aside id="sidebar" class="fixed inset-y-0 left-0 z-40 w-64 bg-surface border-r border-stroke-soft transform -translate-x-full lg:translate-x-0 transition-transform duration-300 ease-in-out lg:static lg:inset-auto lg:h-screen overflow-y-auto">
                <div class="p-6 border-b border-stroke-soft">
                    <div class="flex items-center gap-3">
                        <div class="w-10 h-10 bg-brand rounded-xl flex items-center justify-center shadow-lg shadow-brand/20">
                            <i data-lucide="zap" class="w-6 h-6 btn-text"></i>
                        </div>
                        <div>
                            <h1 class="font-bold text-xl text-content">SkillMatch</h1>
                            <p class="text-xs text-content-muted font-medium">Pro Platform</p>
                        </div>
                    </div>
                </div>

                <nav class="p-4 space-y-1">
                    <a href="#" class="nav-item active  flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200 bg-brand text-white">
                        <i data-lucide="layout-dashboard" class="w-5 h-5"></i>
                        Dashboard
                    </a>
              <a href="{% url 'students:match_opportunities' %}"
                   class="nav-item flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-xl transition-all duration-200
                   {% if request.resolver_match.url_name == 'match_opportunities' %}
                      bg-orange/10 text-orange
                   {% else %}
                      text-content-muted hover:bg-field-base hover:text-content
                   {% endif %}">
                    <i data-lucide="briefcase" class="w-5 h-5"></i>
                    {% trans "Opportunities" %}
                    <span class="ml-auto bg-orange/20 text-orange text-xs font-bold px-2 py-0.5 rounded-full">
                        {{ results|length }}
                    </span>
                </a>
                    <a href="#" class="nav-item flex items-center gap-3 px-4 py-3 text-sm font-medium text-content-muted rounded-xl hover:bg-field-base hover:text-content transition-all duration-200">
                        <i data-lucide="file-check" class="w-5 h-5"></i>
                        Applications
                    </a>
                    <a href="#" class="nav-item flex items-center gap-3 px-4 py-3 text-sm font-medium text-content-muted rounded-xl hover:bg-field-base hover:text-content transition-all duration-200">
                        <i data-lucide="award" class="w-5 h-5"></i>
                        Certificates
                    </a>
                    <a href="{% url 'students:complete_profile' %}" class="nav-item flex items-center gap-3 px-4 py-3 text-sm font-medium text-content-muted rounded-xl hover:bg-field-base hover:text-content transition-all duration-200">
                        <i data-lucide="user" class="w-5 h-5"></i>
                        Profile
                    </a>
                </nav>

                <div class="p-4 mt-auto">
                    <div class="bg-brand rounded-2xl p-4 btn-text">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="w-10 h-10 bg-white/10 rounded-full flex items-center justify-center backdrop-blur-sm">
                                <i data-lucide="sparkles" class="w-5 h-5 text-white"></i>
                            </div>
                            <div>
                                <p class="text-sm font-semibold">Pro Tips</p>
                                <p class="text-xs opacity-80">Complete your profile</p>
                            </div>
                        </div>
                        <div class="w-full bg-white/20 rounded-full h-2 mb-2">
                            <div class="bg-white h-2 rounded-full" style="width: 85%"></div>
                        </div>
                        <p class="text-xs opacity-80">85% Complete</p>
                    </div>
                </div>
            </aside>
          <div class="w-full">


            {% block provider_content %}
                  {% endblock %}
          </div>

        </div>

    </div>
 {% endblock  %}
