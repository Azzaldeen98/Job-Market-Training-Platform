   <header class="bg-surface border-b border-stroke-soft px-6 py-4 sticky top-0 z-30 lg:top-0">
            <div class="flex items-center justify-between gap-4">
                <div class="flex-1 max-w-xl">
                    <div class="relative">
                        <i data-lucide="search" class="absolute left-3 top-1/2 -translate-y-1/2 w-5 h-5 text-content-muted"></i>
                        <input type="text" placeholder="Search..."
                            class="w-full pl-10 pr-4 py-2.5 bg-field-surface border border-stroke-soft rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all text-content">
                    </div>
                </div>

                <div class="flex items-center gap-3">
                    <button class="relative p-2 text-content-muted hover:bg-field-base rounded-xl transition-colors">
                        <i data-lucide="bell" class="w-5 h-5"></i>
                        <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-error rounded-full border-2 border-surface"></span>
                    </button>
                    <div class="flex items-center gap-3 pl-3 border-l border-stroke-soft">
                        <div class="text-right hidden sm:block">
                            <p class="text-sm font-semibold text-content">{{ user.profile.display_name }}</p>
<!--                            <p class="text-xs text-content-muted">{{ user.profile.get_major }}</p>-->
                        </div>
                        {% if user.profile.logo and user.profile.logo.url %}
                        <img src="{{  user.profile.logo.url }}" alt="Profile" class="w-10 h-10 rounded-full object-cover border-2 border-stroke-soft">
                        {% endif  %}
                    </div>
                </div>
            </div>
        </header>
