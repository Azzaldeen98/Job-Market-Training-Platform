<div id="major-wrapper" class="space-y-2">
    <label class="block text-sm font-medium text-gray-700">{% trans 'Category Skills' %}</label>
    <select name="major" class="w-full p-2 border rounded-lg">
        <option value="">{% trans 'Select Skills' %}</option>
        {% for category_skill in category_skills %}
            <option value="{{ category_skill.id }}">{{ category_skill.name }}</option>
        {% endfor %}
    </select>
</div>
