<div id="university-wrapper" class="space-y-2 relative">
    <label class="block text-sm font-medium text-gray-700">{% trans 'Universities' %}</label>

    <div class="relative"> <select name="university"
                class="w-full p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none transition-all"
                hx-get="{% url 'academy:load_colleges' %}"
                hx-target="#college-wrapper"
                hx-indicator="#uni-loader">
            <option value="">اختر الجامعة</option>

            {% if universities %}
                {% for university in universities %}
                    <option value="{{ university.id }}">{{ university.name }}</option>
                {% endfor %}
            {% endif %}
        </select>

        <div id="uni-loader" class="htmx-indicator absolute left-3 top-1/2 -translate-y-1/2 bg-white px-2">
            <div class="flex items-center text-xs text-blue-600 font-semibold">
                <svg class="animate-spin h-4 w-4 mr-1" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
                جاري التحميل...
            </div>
        </div>
    </div>
</div>
